<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - The Species Archive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0f14;
      color: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .offline-container {
      max-width: 480px;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #4CAF50, #2196F3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #9aa0a6;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      display: inline-block;
      padding: 10px 24px;
      background: linear-gradient(135deg, #4CAF50, #2196F3);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-btn:hover { opacity: 0.9; }
    .cached-note {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">&#x1F30D;</div>
    <h1>You're Offline</h1>
    <p>The Species Archive requires an internet connection to load new pages. Previously visited pages may still be available from cache.</p>
    <a href="/" class="retry-btn" onclick="window.location.reload(); return false;">Try Again</a>
    <p class="cached-note">Tip: Visit pages while online to cache them for offline viewing.</p>
  </div>
</body>
</html>
