services:
  ecosurge-web:
    build:
      context: .
      target: production
    container_name: ecosurge-species-archive
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecosurge.rule=Host(`archive.ecosurge.com`)"
